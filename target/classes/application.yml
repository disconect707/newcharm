spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/charm_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  # Теперь приложение попытается взять ключ из переменной окружения JWT_SECRET.
  # Если её нет (при локальном запуске), подставит этот длинный дефолтный ключ.
  secret: ${JWT_SECRET:"CHARM_STORE_SUPER_SECRET_KEY_MUST_BE_AT_LEAST_256_BITS_LONG_FOR_HMAC_SHA"}
  expiration: 86400000